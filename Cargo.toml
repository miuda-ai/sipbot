[package]
name = "sipbot"
version = "0.2.46"
edition = "2024"
authors = ["jinti<shenjindi@fourz.cn>"]
repository = "https://github.com/miuda-ai/sipbot"
description = "A simple SIP bot with RTP"
readme = "README.md"
keywords = ["rtp", "srtp", "sip", "cli"]
categories = ["network-programming"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
tracing = "0.1"
anyhow = "1.0"
rsipstack = "0.5.18"
tokio-util = "0.7.18"
rustrtc = "0.3.92"
audio-codec = "0.3.40"
clap = { version = "4", features = ["derive"] }
chrono = "0.4.45"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
hound = "3.5.1"
bytes = "1.12.0"
rand = "0.10.1"
futures = "0.3.32"
cpal = { version = "0.17.2", optional = true }
ringbuf = { version = "0.5.0", optional = true }

[features]
default = ["local-device"]
local-device = ["dep:cpal", "dep:ringbuf"]
